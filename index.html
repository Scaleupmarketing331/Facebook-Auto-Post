<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ================================
         01. BASIC DOCUMENT SETTINGS
         ================================= -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AutoPost AI | Facebook Automation</title>

    <meta name="description"
          content="AI powered Facebook post automation dashboard">


    <!-- ================================
         02. CSS
         ================================= -->

    <style>

        /* ---------- GLOBAL ---------- */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --background: #060a12;
            --card: #0d1422;
            --card-light: #121c2d;
            --border: rgba(255,255,255,0.08);
            --text: #ffffff;
            --muted: #94a3b8;
            --blue: #1877f2;
            --blue-light: #4f9cff;
            --green: #22c55e;
        }

        body {
            min-height: 100vh;
            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(24,119,242,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(79,70,229,0.14),
                    transparent 30%
                ),
                var(--background);
        }


        /* ---------- HEADER ---------- */

        header {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            border-bottom: 1px solid var(--border);

            background: rgba(6,10,18,0.85);

            backdrop-filter: blur(20px);

            position: sticky;
            top: 0;

            z-index: 100;
        }


        /* ---------- LOGO ---------- */

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;

            font-size: 20px;
            font-weight: 800;
        }

        .logo-icon {
            width: 42px;
            height: 42px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #1877f2,
                    #4f46e5
                );

            box-shadow:
                0 8px 25px
                rgba(24,119,242,0.35);
        }


        /* ---------- ONLINE STATUS ---------- */

        .status {
            display: flex;
            align-items: center;
            gap: 8px;

            color: var(--muted);

            font-size: 13px;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 12px var(--green);
        }


        /* ---------- MAIN ---------- */

        .container {
            width: 90%;
            max-width: 1400px;

            margin: auto;

            padding: 45px 0 70px;
        }


        /* ---------- HERO ---------- */

        .hero {
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: clamp(
                32px,
                5vw,
                55px
            );

            line-height: 1.05;

            letter-spacing: -2px;

            margin-bottom: 15px;
        }

        .gradient-text {
            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #65a5ff
                );

            -webkit-background-clip: text;

            color: transparent;
        }

        .hero p {
            max-width: 720px;

            color: var(--muted);

            line-height: 1.7;
        }


        /* ---------- DASHBOARD ---------- */

        .dashboard {
            display: grid;

            grid-template-columns:
                1.1fr 0.9fr;

            gap: 22px;
        }


        /* ---------- CARD ---------- */

        .card {
            padding: 25px;

            border-radius: 22px;

            border: 1px solid var(--border);

            background:
                linear-gradient(
                    145deg,
                    rgba(18,28,45,0.96),
                    rgba(8,13,23,0.96)
                );

            box-shadow:
                0 20px 70px
                rgba(0,0,0,0.25);
        }


        /* ---------- CARD HEADER ---------- */

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 22px;
        }

        .card-header h2 {
            font-size: 18px;
        }


        /* ---------- BADGE ---------- */

        .badge {
            padding: 6px 10px;

            border-radius: 30px;

            background:
                rgba(24,119,242,0.12);

            color: #70a8ff;

            font-size: 11px;

            font-weight: 700;
        }


        /* ---------- FORM ---------- */

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 9px;

            color: #cbd5e1;

            font-size: 13px;

            font-weight: 600;
        }


        textarea,
        select {

            width: 100%;

            padding: 15px;

            border-radius: 14px;

            border: 1px solid var(--border);

            outline: none;

            background: #080e19;

            color: white;

            transition: 0.2s;
        }


        textarea {

            min-height: 180px;

            resize: vertical;

            line-height: 1.6;
        }


        textarea:focus,
        select:focus {

            border-color:
                rgba(79,156,255,0.8);

            box-shadow:
                0 0 0 3px
                rgba(24,119,242,0.08);
        }


        /* ---------- TWO COLUMNS ---------- */

        .row {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 14px;
        }


        /* ---------- BUTTON ---------- */

        .generate-button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 14px;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #1877f2,
                    #4f46e5
                );

            box-shadow:
                0 12px 30px
                rgba(24,119,242,0.25);

            transition: 0.2s;
        }


        .generate-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 16px 35px
                rgba(24,119,242,0.35);
        }


        /* ---------- LOADER ---------- */

        .loader {

            display: none;

            text-align: center;

            color: var(--muted);

            font-size: 12px;

            margin-top: 15px;
        }

        .loader.active {
            display: block;
        }

        .spinner {

            width: 22px;
            height: 22px;

            margin:
                0 auto 8px;

            border:
                3px solid #26344b;

            border-top-color:
                var(--blue-light);

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }
        }


        /* ---------- FACEBOOK PREVIEW ---------- */

        .facebook-preview {

            overflow: hidden;

            border-radius: 17px;

            border:
                1px solid var(--border);

            background: #080d17;
        }


        /* ---------- FACEBOOK HEADER ---------- */

        .facebook-header {

            display: flex;

            align-items: center;

            gap: 11px;

            padding: 15px;

            border-bottom:
                1px solid var(--border);
        }


        .facebook-avatar {

            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #1877f2,
                    #4f46e5
                );

            font-weight: 800;
        }


        .facebook-user strong {

            display: block;

            font-size: 13px;
        }


        .facebook-user span {

            color: var(--muted);

            font-size: 11px;
        }


        /* ---------- IMAGE PLACEHOLDER ---------- */

        .post-image {

            height: 270px;

            display: flex;

            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 20px;

            color: #64748b;

            background:
                linear-gradient(
                    135deg,
                    rgba(24,119,242,0.22),
                    rgba(79,70,229,0.12)
                ),
                #101827;
        }


        /* ---------- POST TEXT ---------- */

        .post-content {

            padding: 17px;
        }


        .post-content p {

            color: #cbd5e1;

            font-size: 13px;

            line-height: 1.7;

            white-space: pre-wrap;
        }


        /* ---------- FACEBOOK ACTIONS ---------- */

        .post-actions {

            display: flex;

            justify-content:
                space-around;

            padding: 13px;

            border-top:
                1px solid var(--border);

            color: #94a3b8;

            font-size: 12px;
        }


        /* ---------- WORKFLOW ---------- */

        .workflow {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 13px;

            margin-top: 22px;
        }


        .workflow-step {

            padding: 18px;

            border-radius: 16px;

            border:
                1px solid var(--border);

            background:
                rgba(255,255,255,0.025);
        }


        .step-number {

            width: 32px;
            height: 32px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 12px;

            border-radius: 10px;

            background:
                rgba(24,119,242,0.14);

            color: #70a8ff;

            font-weight: 800;
        }


        .workflow-step h3 {

            font-size: 13px;

            margin-bottom: 6px;
        }


        .workflow-step p {

            color: var(--muted);

            font-size: 11px;

            line-height: 1.5;
        }


        /* ---------- ACTIVITY ---------- */

        .activity {

            margin-top: 22px;
        }


        .activity-item {

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 13px 0;

            border-bottom:
                1px solid var(--border);

            font-size: 12px;
        }


        .activity-icon {

            width: 30px;
            height: 30px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 9px;

            color: var(--green);

            background:
                rgba(34,197,94,0.1);
        }


        .activity-time {

            margin-left: auto;

            color: #64748b;
        }


        /* ---------- RESPONSIVE ---------- */

        @media (max-width: 950px) {

            .dashboard {

                grid-template-columns: 1fr;
            }

            .workflow {

                grid-template-columns:
                    1fr 1fr;
            }
        }


        @media (max-width: 600px) {

            header {

                padding:
                    0 20px;
            }

            .status {

                display: none;
            }

            .container {

                width: 92%;
            }

            .card {

                padding: 18px;
            }

            .row,
            .workflow {

                grid-template-columns:
                    1fr;
            }

            .post-image {

                height: 220px;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================================
         03. HEADER
         ========================================== -->

    <header>

        <div class="logo">

            <div class="logo-icon">
                AI
            </div>

            AutoPost AI

        </div>


        <div class="status">

            <span class="status-dot"></span>

            Automation System Online

        </div>

    </header>



    <!-- ==========================================
         04. MAIN CONTENT
         ========================================== -->

    <main class="container">


        <!-- HERO -->

        <section class="hero">

            <h1>

                Create & Publish

                <span class="gradient-text">
                    Facebook Posts With AI.
                </span>

            </h1>


            <p>

                Send one simple instruction and let your
                AI automation prepare your Facebook post,
                creative content and publishing workflow.

            </p>

        </section>



        <!-- ======================================
             05. DASHBOARD
             ====================================== -->

        <section class="dashboard">


            <!-- ==================================
                 LEFT SIDE
                 ================================== -->

            <div>


                <!-- CREATE POST CARD -->

                <div class="card">


                    <div class="card-header">

                        <h2>
                            ✨ Create New Post
                        </h2>

                        <span class="badge">
                            AI POWERED
                        </span>

                    </div>


                    <!-- USER PROMPT -->

                    <div class="form-group">

                        <label>
                            What do you want to post?
                        </label>


                        <textarea
                            id="prompt"
                            placeholder="Example: Jumma Mubarak ki premium Islamic post banao. Urdu text ho, elegant golden mosque background ho aur professional Facebook caption aur hashtags bhi generate karo."
                        ></textarea>

                    </div>



                    <!-- POST TYPE + LANGUAGE -->

                    <div class="row">


                        <div class="form-group">

                            <label>
                                Post Type
                            </label>

                            <select id="postType">

                                <option>
                                    AI Social Media Post
                                </option>

                                <option>
                                    Islamic Post
                                </option>

                                <option>
                                    Business Advertisement
                                </option>

                                <option>
                                    Product Promotion
                                </option>

                                <option>
                                    Event Announcement
                                </option>

                                <option>
                                    Quote / Poetry
                                </option>

                            </select>

                        </div>



                        <div class="form-group">

                            <label>
                                Language
                            </label>

                            <select id="language">

                                <option>
                                    Urdu
                                </option>

                                <option>
                                    English
                                </option>

                                <option>
                                    Roman Urdu
                                </option>

                                <option>
                                    Urdu + English
                                </option>

                            </select>

                        </div>

                    </div>



                    <!-- STYLE + MODE -->

                    <div class="row">


                        <div class="form-group">

                            <label>
                                Design Style
                            </label>

                            <select id="designStyle">

                                <option>
                                    Premium 3D
                                </option>

                                <option>
                                    Modern Minimal
                                </option>

                                <option>
                                    Luxury
                                </option>

                                <option>
                                    Islamic Elegant
                                </option>

                                <option>
                                    Corporate
                                </option>

                                <option>
                                    Cinematic
                                </option>

                            </select>

                        </div>



                        <div class="form-group">

                            <label>
                                Publish Mode
                            </label>

                            <select id="publishMode">

                                <option>
                                    Generate Only
                                </option>

                                <option>
                                    Generate & Publish
                                </option>

                                <option>
                                    Schedule Post
                                </option>

                            </select>

                        </div>

                    </div>



                    <!-- GENERATE BUTTON -->

                    <button
                        class="generate-button"
                        onclick="generatePost()"
                    >

                        ✨ Generate AI Post

                    </button>



                    <!-- LOADER -->

                    <div
                        class="loader"
                        id="loader"
                    >

                        <div class="spinner"></div>

                        AI is preparing your post...

                    </div>


                </div>



                <!-- ==================================
                     WORKFLOW CARD
                     =================
